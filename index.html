<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Orbit — Space Exploration Quiz</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f5fb;
      --surface: #fff;
      --surface-soft: #f7f7fc;
      --ink: #20213a;
      --muted: #777990;
      --line: #e8e8f1;
      --accent: #6955e8;
      --accent-soft: #efedff;
      --correct: #16875e;
      --correct-bg: #e8f8f0;
      --wrong: #d44858;
      --wrong-bg: #fff0f0;
      --signal: #087f88;
      --signal-soft: #e5f5f5;
      --console-grid: rgb(57 92 130 / 5%);
      --console-glow: rgb(87 127 255 / 8%);
      --shadow: 0 24px 70px rgb(39 35 91 / 10%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11121d;
        --surface: #1b1c2a;
        --surface-soft: #242536;
        --ink: #f2f1ff;
        --muted: #a5a5ba;
        --line: #333448;
        --accent: #a194ff;
        --accent-soft: #302d4c;
        --correct: #67d6a4;
        --correct-bg: #203a32;
        --wrong: #ff8991;
        --wrong-bg: #42282f;
        --signal: #6fe2d8;
        --signal-soft: #1e373b;
        --console-grid: rgb(166 190 255 / 5%);
        --console-glow: rgb(100 117 255 / 10%);
        --shadow: 0 24px 70px rgb(0 0 0 / 28%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 0%, rgb(132 116 255 / 12%), transparent 38rem),
        var(--page);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    button { font: inherit; }

    .app { width: min(100%, 520px); }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(145deg, #8876ff, #5b45d8);
      font-size: 16px;
      letter-spacing: 0;
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--signal) 24%, var(--line));
      border-radius: 20px;
      background:
        radial-gradient(ellipse at 100% 0%, var(--console-glow), transparent 44%),
        linear-gradient(90deg, var(--console-grid) 1px, transparent 1px),
        linear-gradient(var(--console-grid) 1px, transparent 1px),
        var(--surface);
      background-size: auto, 22px 22px, 22px 22px, auto;
      box-shadow: var(--shadow);
    }

    .card::before {
      position: absolute;
      z-index: 1;
      top: 0;
      right: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--signal), var(--accent) 58%, transparent);
      content: "";
    }

    .console-header {
      display: flex;
      min-height: 58px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 30px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface-soft) 80%, transparent);
    }

    .console-title, .console-state {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .console-title { color: var(--muted); }

    .console-icon {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--signal) 35%, transparent);
      border-radius: 8px;
      color: var(--signal);
      background: var(--signal-soft);
      font-size: 15px;
      letter-spacing: 0;
    }

    .console-state {
      gap: 7px;
      color: var(--signal);
      font-size: 10px;
      letter-spacing: .1em;
    }

    .signal-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 10px color-mix(in srgb, currentColor 65%, transparent);
    }

    .card-content { padding: 27px 30px 30px; }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .score {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
    }

    .score-icon { color: #e3a52e; }

    .progress-track {
      height: 9px;
      overflow: hidden;
      margin-bottom: 28px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface-soft);
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--signal), var(--accent));
      box-shadow: 0 0 12px color-mix(in srgb, var(--signal) 55%, transparent);
      transition: width 350ms ease;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--signal);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 23px;
      font-size: clamp(22px, 5vw, 27px);
      line-height: 1.28;
      letter-spacing: -.035em;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      display: flex;
      min-height: 53px;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: var(--surface);
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .answer:not(:disabled):hover {
      box-shadow: inset 3px 0 var(--signal);
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: var(--surface-soft);
    }

    .answer:focus-visible, .primary-button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-key {
      display: grid;
      width: 29px;
      height: 29px;
      flex: 0 0 29px;
      place-items: center;
      border-radius: 9px;
      color: var(--muted);
      background: var(--surface-soft);
      font-size: 13px;
      font-weight: 700;
    }

    .answer.correct {
      border-color: var(--correct);
      color: var(--correct);
      background: var(--correct-bg);
      animation: pop-in 320ms ease both;
    }

    .answer.correct .answer-key {
      color: white;
      background: var(--correct);
    }

    .answer.incorrect {
      border-color: var(--wrong);
      color: var(--wrong);
      background: var(--wrong-bg);
      animation: shake 360ms ease both;
    }

    .answer.incorrect .answer-key {
      color: white;
      background: var(--wrong);
    }

    .feedback {
      min-height: 24px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .feedback.is-correct { color: var(--correct); }
    .feedback.is-wrong { color: var(--wrong); }

    .card-footer {
      display: flex;
      min-height: 76px;
      align-items: center;
      justify-content: flex-end;
      padding: 14px 30px;
      border-top: 1px solid var(--line);
      background: var(--surface-soft);
    }

    .primary-button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 19px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, #7966f1, #5b47d7);
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .primary-button:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .primary-button:active { transform: translateY(0); }

    .results {
      padding: 42px 30px 38px;
      text-align: center;
    }

    .result-emoji {
      display: grid;
      width: 88px;
      height: 88px;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 28px;
      background: var(--accent-soft);
      font-size: 48px;
      animation: float-in 500ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .results h1 { margin-bottom: 8px; }
    .result-copy { margin-bottom: 24px; color: var(--muted); }

    .result-score {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      margin-bottom: 26px;
      color: var(--accent);
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -.05em;
    }

    .result-score span:last-child {
      color: var(--muted);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .results .primary-button { width: 100%; }

    [hidden] { display: none !important; }

    @keyframes shake {
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }

    @keyframes pop-in {
      50% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }

    @keyframes float-in {
      from { opacity: 0; transform: translateY(10px) scale(.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 480px) {
      body { padding: 28px 15px; }
      .card-content { padding: 24px 20px; }
      .console-header { min-height: 54px; padding: 0 20px; }
      .card-footer { min-height: 70px; padding: 12px 20px; }
      .results { padding: 36px 22px 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand" aria-label="Orbit space quiz">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>Orbit · Space quiz</span>
    </div>

    <section class="card" aria-label="Space exploration quiz">
      <header class="console-header">
        <span class="console-title"><span class="console-icon" aria-hidden="true">⌖</span> Mission control</span>
        <span class="console-state"><span class="signal-dot" aria-hidden="true"></span> Systems ready</span>
      </header>
      <div id="quiz-screen">
        <div class="card-content">
          <div class="status-row">
            <span id="question-count" aria-live="polite">Question 1 of 10</span>
            <span class="score"><span class="score-icon" aria-hidden="true">★</span><span id="score">0</span> points</span>
          </div>
          <div
            class="progress-track"
            role="progressbar"
            aria-label="Quiz progress"
            aria-valuemin="0"
            aria-valuemax="10"
            aria-valuenow="1"
          >
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <p class="eyebrow" id="category">Solar system</p>
          <h1 id="question" tabindex="-1"></h1>
          <div class="answers" id="answers"></div>
          <p class="feedback" id="feedback" aria-live="polite"></p>
        </div>
        <div class="card-footer">
          <button class="primary-button" id="next-button" type="button" hidden>
            Next question <span aria-hidden="true">→</span>
          </button>
        </div>
      </div>

      <div class="results" id="results-screen" hidden aria-live="polite">
        <div class="result-emoji" id="result-emoji" aria-hidden="true"></div>
        <p class="eyebrow">Mission complete</p>
        <h1 id="result-title">Explorer, that was stellar!</h1>
        <p class="result-copy" id="result-copy"></p>
        <div class="result-score"><span id="final-score">0</span><span>/ 10 correct</span></div>
        <button class="primary-button" id="restart-button" type="button">
          <span aria-hidden="true">↻</span> Explore again
        </button>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      {
        category: "Solar system",
        question: "Which planet is known as the Red Planet?",
        answers: ["Venus", "Mars", "Jupiter", "Mercury"],
        correct: 1,
        fact: "Mars looks red because its surface is rich in iron oxide — rust!"
      },
      {
        category: "The Moon",
        question: "What is the name of the first crewed mission to land on the Moon?",
        answers: ["Apollo 8", "Gemini 4", "Apollo 11", "Artemis I"],
        correct: 2,
        fact: "Apollo 11 landed astronauts Neil Armstrong and Buzz Aldrin on the Moon in 1969."
      },
      {
        category: "Our star",
        question: "What is the Sun mostly made of?",
        answers: ["Liquid rock", "Hydrogen and helium", "Oxygen and nitrogen", "Ice and dust"],
        correct: 1,
        fact: "The Sun is a giant ball of plasma, made mostly of hydrogen and helium."
      },
      {
        category: "Solar system",
        question: "Which planet has the most prominent ring system?",
        answers: ["Saturn", "Neptune", "Earth", "Mars"],
        correct: 0,
        fact: "Saturn's dazzling rings are made mostly of countless pieces of ice and rock."
      },
      {
        category: "Deep space",
        question: "What is a light-year a measure of?",
        answers: ["Time", "Brightness", "Distance", "Speed"],
        correct: 2,
        fact: "A light-year is the distance light travels in one year: about 9.46 trillion kilometers."
      },
      {
        category: "Spaceflight",
        question: "What do astronauts wear to protect themselves during a spacewalk?",
        answers: ["A flight suit", "A spacesuit", "A heat shield", "A parachute"],
        correct: 1,
        fact: "A spacesuit provides oxygen, pressure, and protection from extreme temperatures."
      },
      {
        category: "Solar system",
        question: "Which is the largest planet in our solar system?",
        answers: ["Saturn", "Earth", "Neptune", "Jupiter"],
        correct: 3,
        fact: "Jupiter is so large that more than 1,300 Earths could fit inside it."
      },
      {
        category: "Exploration",
        question: "What is the name of NASA's famous space telescope launched in 1990?",
        answers: ["Kepler", "Hubble", "Voyager", "Pioneer"],
        correct: 1,
        fact: "The Hubble Space Telescope has helped us observe the universe for over three decades."
      },
      {
        category: "Solar system",
        question: "Which planet rotates on its side?",
        answers: ["Uranus", "Mercury", "Venus", "Mars"],
        correct: 0,
        fact: "Uranus is tilted by about 98 degrees, making it seem to roll around the Sun."
      },
      {
        category: "Deep space",
        question: "What is the name of the galaxy that contains our solar system?",
        answers: ["Andromeda", "Whirlpool", "Sombrero", "Milky Way"],
        correct: 3,
        fact: "Our solar system lives in the Milky Way, a galaxy with hundreds of billions of stars."
      }
    ];

    const questionCount = document.querySelector("#question-count");
    const scoreDisplay = document.querySelector("#score");
    const progress = document.querySelector(".progress-track");
    const progressFill = document.querySelector("#progress-fill");
    const category = document.querySelector("#category");
    const questionHeading = document.querySelector("#question");
    const answersContainer = document.querySelector("#answers");
    const feedback = document.querySelector("#feedback");
    const nextButton = document.querySelector("#next-button");
    const quizScreen = document.querySelector("#quiz-screen");
    const resultsScreen = document.querySelector("#results-screen");
    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      const item = questions[currentQuestion];
      answered = false;
      questionCount.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      scoreDisplay.textContent = score;
      category.textContent = item.category;
      questionHeading.textContent = item.question;
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.hidden = true;
      nextButton.innerHTML = currentQuestion === questions.length - 1
        ? 'See my results <span aria-hidden="true">→</span>'
        : 'Next question <span aria-hidden="true">→</span>';
      progress.setAttribute("aria-valuenow", currentQuestion + 1);
      progressFill.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
      answersContainer.replaceChildren();

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.innerHTML = `<span class="answer-key">${String.fromCharCode(65 + index)}</span><span></span>`;
        button.lastElementChild.textContent = answer;
        button.addEventListener("click", () => selectAnswer(index, button));
        answersContainer.append(button);
      });
    }

    function selectAnswer(selected, selectedButton) {
      if (answered) return;
      answered = true;

      const item = questions[currentQuestion];
      const buttons = [...answersContainer.children];
      buttons.forEach(button => { button.disabled = true; });

      if (selected === item.correct) {
        score += 1;
        scoreDisplay.textContent = score;
        selectedButton.classList.add("correct");
        feedback.textContent = `Correct! ${item.fact}`;
        feedback.classList.add("is-correct");
      } else {
        selectedButton.classList.add("incorrect");
        buttons[item.correct].classList.add("correct");
        feedback.textContent = `Not quite. ${item.fact}`;
        feedback.classList.add("is-wrong");
      }

      nextButton.hidden = false;
      nextButton.focus();
    }

    function showResults() {
      quizScreen.hidden = true;
      resultsScreen.hidden = false;
      document.querySelector("#final-score").textContent = score;

      const result = score >= 8
        ? { emoji: "🚀", title: "You're a space superstar!", copy: "Incredible work — the universe is lucky to have you." }
        : score >= 5
          ? { emoji: "🌟", title: "A stellar adventure!", copy: "You know your way around the cosmos. Keep exploring!" }
          : { emoji: "🪐", title: "Your journey is just beginning!", copy: "Every great explorer starts somewhere. Ready for another orbit?" };

      document.querySelector("#result-emoji").textContent = result.emoji;
      document.querySelector("#result-title").textContent = result.title;
      document.querySelector("#result-copy").textContent = result.copy;
      document.querySelector("#restart-button").focus();
    }

    nextButton.addEventListener("click", () => {
      if (currentQuestion === questions.length - 1) {
        progress.setAttribute("aria-valuenow", questions.length);
        progressFill.style.width = "100%";
        showResults();
        return;
      }
      currentQuestion += 1;
      renderQuestion();
      questionHeading.focus({ preventScroll: true });
    });

    document.querySelector("#restart-button").addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;
      resultsScreen.hidden = true;
      quizScreen.hidden = false;
      renderQuestion();
      answersContainer.querySelector("button").focus();
    });

    renderQuestion();
  </script>
</body>
</html>
